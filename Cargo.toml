[package]
name = "sqlite-zstd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "SQLite extension for seamless TEXT field compression using Zstandard"
repository = "https://github.com/brianmacy/sqlite-zstd"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
loadable_extension = ["rusqlite/loadable_extension"]

[dependencies]
zstd = "0.13"
# Using same forked rusqlite as sqlite-vec-hnsw for consistent SQLite shared library handling
rusqlite = { git = "https://github.com/brianmacy/rusqlite", branch = "custom-vtab-features", features = ["bundled", "functions", "vtab"] }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "compression_bench"
harness = false
